<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc94d"/>
      <stop offset="1" stop-color="#e0653a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.30" cy="0.24" r="0.95">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#ffc94d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pickHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2013"/>
      <stop offset="1" stop-color="#140f08"/>
    </linearGradient>
  </defs>

  <!-- Tile cálido full-bleed (iOS aplica su propia máscara redondeada) -->
  <rect width="512" height="512" fill="url(#tile)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Púa (mismo path del logo del header), centrada -->
  <g transform="translate(100,96) scale(13)">
    <path fill="url(#pickHi)"
          d="M12 2c4 0 7 3 7 7 0 3-2 5-3.5 7.5C14 19 13 22 12 22s-2-3-3.5-5.5C7 14 5 12 5 9c0-4 3-7 7-7z"/>
    <!-- brillo sutil arriba de la púa -->
    <path fill="#ffffff" opacity="0.10"
          d="M12 2c4 0 7 3 7 7 0 1.6-.6 3-1.4 4.4C15.6 11 13.9 9.6 12 9.6S8.4 11 6.4 13.4C5.6 12 5 10.6 5 9c0-4 3-7 7-7z"/>
  </g>
</svg>
