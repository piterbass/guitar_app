<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#1a1a2e"/>
  <g transform="translate(256,256)">
    <!-- Guitar neck / fretboard -->
    <rect x="-60" y="-180" width="120" height="360" rx="8" fill="#2a1a0a" stroke="#4ecdc4" stroke-width="3"/>
    <!-- Frets -->
    <line x1="-55" y1="-108" x2="55" y2="-108" stroke="#888" stroke-width="2"/>
    <line x1="-55" y1="-36" x2="55" y2="-36" stroke="#888" stroke-width="2"/>
    <line x1="-55" y1="36" x2="55" y2="36" stroke="#888" stroke-width="2"/>
    <line x1="-55" y1="108" x2="55" y2="108" stroke="#888" stroke-width="2"/>
    <!-- Strings -->
    <line x1="-40" y1="-180" x2="-40" y2="180" stroke="#ccc" stroke-width="1.5"/>
    <line x1="-24" y1="-180" x2="-24" y2="180" stroke="#ccc" stroke-width="1.3"/>
    <line x1="-8" y1="-180" x2="-8" y2="180" stroke="#ccc" stroke-width="1.1"/>
    <line x1="8" y1="-180" x2="8" y2="180" stroke="#ccc" stroke-width="1"/>
    <line x1="24" y1="-180" x2="24" y2="180" stroke="#ccc" stroke-width="0.9"/>
    <line x1="40" y1="-180" x2="40" y2="180" stroke="#ccc" stroke-width="0.8"/>
    <!-- Chord dots -->
    <circle cx="-24" cy="-72" r="12" fill="#e94560"/>
    <circle cx="8" cy="-72" r="12" fill="#e94560"/>
    <circle cx="24" cy="0" r="12" fill="#e94560"/>
    <circle cx="-8" cy="72" r="12" fill="#e94560"/>
    <!-- Scale overlay dots -->
    <circle cx="-40" cy="0" r="8" fill="#4ecdc4" opacity="0.7"/>
    <circle cx="40" cy="-72" r="8" fill="#4ecdc4" opacity="0.7"/>
    <circle cx="-8" cy="-144" r="8" fill="#4ecdc4" opacity="0.7"/>
    <circle cx="40" cy="72" r="8" fill="#4ecdc4" opacity="0.7"/>
  </g>
</svg>
