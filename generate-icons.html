<!DOCTYPE html>
<html>
<head><title>Generar Iconos PWA</title></head>
<body>
<h2>Generar iconos PWA</h2>
<p>Haz clic derecho en cada imagen y "Guardar imagen como..." en la carpeta de Guitar_app</p>
<div>
  <h3>icon-192.png</h3>
  <canvas id="c192" width="192" height="192"></canvas>
</div>
<div>
  <h3>icon-512.png</h3>
  <canvas id="c512" width="512" height="512"></canvas>
</div>
<script>
function drawIcon(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');
  const r = s / 512; // scale ratio

  // Background
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, 80 * r);
  ctx.fill();

  ctx.save();
  ctx.translate(s/2, s/2);

  // Fretboard
  ctx.fillStyle = '#2a1a0a';
  ctx.strokeStyle = '#4ecdc4';
  ctx.lineWidth = 3 * r;
  ctx.beginPath();
  ctx.roundRect(-60*r, -180*r, 120*r, 360*r, 8*r);
  ctx.fill();
  ctx.stroke();

  // Frets
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 2 * r;
  [-108, -36, 36, 108].forEach(y => {
    ctx.beginPath();
    ctx.moveTo(-55*r, y*r);
    ctx.lineTo(55*r, y*r);
    ctx.stroke();
  });

  // Strings
  const sx = [-40,-24,-8,8,24,40];
  const sw = [1.5,1.3,1.1,1,0.9,0.8];
  ctx.strokeStyle = '#ccc';
  sx.forEach((x,i) => {
    ctx.lineWidth = sw[i] * r;
    ctx.beginPath();
    ctx.moveTo(x*r, -180*r);
    ctx.lineTo(x*r, 180*r);
    ctx.stroke();
  });

  // Chord dots (red)
  ctx.fillStyle = '#e94560';
  [[-24,-72],[8,-72],[24,0],[-8,72]].forEach(([x,y]) => {
    ctx.beginPath();
    ctx.arc(x*r, y*r, 12*r, 0, Math.PI*2);
    ctx.fill();
  });

  // Scale dots (teal)
  ctx.fillStyle = 'rgba(78,205,196,0.7)';
  [[-40,0],[40,-72],[-8,-144],[40,72]].forEach(([x,y]) => {
    ctx.beginPath();
    ctx.arc(x*r, y*r, 8*r, 0, Math.PI*2);
    ctx.fill();
  });

  ctx.restore();
}

drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));

// Auto-download
['c192','c512'].forEach(id => {
  const canvas = document.getElementById(id);
  const link = document.createElement('a');
  link.download = id === 'c192' ? 'icon-192.png' : 'icon-512.png';
  link.href = canvas.toDataURL('image/png');
  const btn = document.createElement('button');
  btn.textContent = 'Descargar ' + link.download;
  btn.onclick = () => link.click();
  canvas.parentElement.appendChild(btn);
});
</script>
</body>
</html>
